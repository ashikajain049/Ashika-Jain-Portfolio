<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ashika Jain — Product Designer</title>
<link rel="preconnect" href="https://api.fontshare.com">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=satoshi@400,900&display=swap">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;900&display=swap">
<style>
  :root {
    --space: #03050d;
    --g1: #ffe2cc;
    --g2: #f1d0d8;
    --g3: #d9b4e9;
    --g4: #c99cf0;
    --sub: #c8c0cd;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; background: var(--space); overflow: hidden; }
  canvas { position: fixed; inset: 0; width: 100%; height: 100%; display: block; z-index: 0; }

  /* ---------- text layer ---------- */
  .copy {
    position: fixed; inset: 0; z-index: 1;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    text-align: center; pointer-events: none;
    font-family: 'Satoshi', 'Inter', system-ui, sans-serif;
    padding: 0 16px;
  }
  .copy h1 {
    margin: 0;
    font-weight: 900;
    font-size: clamp(26px, 3.4vw, 52px);
    letter-spacing: -0.035em;
    line-height: 1;
    text-transform: uppercase;
    white-space: nowrap;
    background-image: linear-gradient(90deg, var(--g1) 0%, var(--g2) 16%, var(--g3) 33%, var(--g4) 50%, var(--g3) 66%, var(--g2) 83%, var(--g1) 100%);
    background-size: 250% 100%;
    background-position: 0% 50%;
    -webkit-background-clip: text; background-clip: text;
    -webkit-text-fill-color: transparent; color: transparent;
    animation: drift 9s ease-in-out infinite alternate;
  }
  /* gentle gradient sweep across the heading */
  @keyframes drift { from { background-position: 0% 50%; } to { background-position: 100% 50%; } }
  .copy p {
    margin: 18px 0 0;
    font-weight: 400;
    font-size: clamp(11px, 1vw, 16px);
    letter-spacing: 0.28em;
    line-height: 1.4;
    text-transform: uppercase;
    color: var(--sub);
  }
  @media (prefers-reduced-motion: reduce) { .copy h1 { animation: none; } }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div class="copy">
  <h1>Something new is on its way.</h1>
  <p>Ashika Jain · Product Designer</p>
</div>

<script>
(() => {
  const cv = document.getElementById('c');
  const ctx = cv.getContext('2d');

  const PALETTE = ['#ffffff', '#e8f0ff', '#cfe0ff', '#b5ccff', '#9db8f5', '#dfe8ff'];
  const rand = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[(Math.random() * a.length) | 0];
  const hexToRgb = h => [parseInt(h.slice(1, 3), 16), parseInt(h.slice(3, 5), 16), parseInt(h.slice(5, 7), 16)];
  const ease = (cur, target, rate, f60) => cur + (target - cur) * (1 - Math.pow(1 - rate, f60));

  let W = 0, H = 0, DPR = 1;
  let stars = [], shooters = [];

  // pointer + hover energy
  const mouse = { x: 0, y: 0, sx: 0, sy: 0, inside: false, init: false };
  const hover = { e: 0, left: 0, right: 0 };

  function makeStar(tier, extra) {
    const s = { tier, extra: !!extra };
    s.hx = Math.random() * W; s.hy = Math.random() * H;
    s.x = s.hx; s.y = s.hy; s.vx = 0; s.vy = 0;
    s.color = hexToRgb(pick(PALETTE));
    if (tier === 0) { s.r = rand(0.5, 0.9); s.base = rand(0.25, 0.55); }
    else if (tier === 1) { s.r = rand(1.1, 1.7); s.base = rand(0.5, 0.85); }
    else { s.r = rand(1.5, 2.1); s.base = rand(0.7, 0.95); }
    s.tw = rand(0.15, 0.6) * (tier === 0 ? 0.4 : 1);
    s.ph = rand(0, Math.PI * 2);
    s.sparkle = tier === 1 && Math.random() < 0.35;
    s.drift = rand(0.4, 1.2);
    s.dph = rand(0, 6.28);
    s.orbit = 50 + Math.random() * 170;        // distance this star settles at around the pointer
    s.swirl = rand(-1, 1);
    s.mass = tier === 0 ? 0.6 : tier === 1 ? 1 : 1.25;
    return s;
  }

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    cv.width = Math.round(W * DPR); cv.height = Math.round(H * DPR);
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    const area = W * H;
    const n0 = Math.round(area / 4200), n1 = Math.round(area / 10000), n2 = Math.round(area / 46000);
    stars = [];
    for (let i = 0; i < n0; i++) stars.push(makeStar(0));
    for (let i = 0; i < n1; i++) stars.push(makeStar(1));
    for (let i = 0; i < n2; i++) stars.push(makeStar(2));
    // extra stars that only appear while hovering (density increase)
    const nx = Math.round(area / 22000);
    for (let i = 0; i < nx; i++) stars.push(makeStar(Math.random() < 0.3 ? 1 : 0, true));
  }

  /* ---------- background nebulae ---------- */
  function glow(cx, cy, rx, ry, rot, stops) {
    ctx.save();
    ctx.translate(cx, cy); ctx.rotate(rot); ctx.scale(rx, ry);
    const g = ctx.createRadialGradient(0, 0, 0, 0, 0, 1);
    stops.forEach(([o, c]) => g.addColorStop(o, c));
    ctx.fillStyle = g;
    ctx.beginPath(); ctx.arc(0, 0, 1, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function drawNebulae() {
    glow(W * 0.12, H * 0.28, W * 0.34, H * 0.62, 0, [[0, 'rgba(22,40,84,0.34)'], [0.6, 'rgba(16,30,64,0.2)'], [1, 'rgba(10,20,44,0)']]);
    glow(W * 0.4, H * 0.82, W * 0.26, H * 0.4, 0, [[0, 'rgba(18,32,70,0.18)'], [1, 'rgba(10,20,44,0)']]);
  }
  // soft gradients that bloom in from the sides while hovering
  function drawEdgeGlows() {
    if (hover.e < 0.01) return;
    const e = hover.e;
    const edge = (cx, cy, rx, ry, w) => {
      if (w < 0.01) return;
      const a = 0.12 * w * e;
      glow(cx, cy, rx, ry, 0, [[0, `rgba(30,56,120,${a.toFixed(3)})`], [1, 'rgba(20,40,90,0)']]);
    };
    edge(-W * 0.02, mouse.sy, W * 0.34, H * 0.7, hover.left);
    edge(W * 1.02, mouse.sy, W * 0.34, H * 0.7, hover.right);
  }

  /* ---------- stars ---------- */
  function drawStar(s, t) {
    const boost = 1 + 0.25 * hover.e;
    const vis = s.extra ? hover.e : 1;
    if (vis < 0.02) return;
    const tw = 0.5 + 0.5 * Math.sin(t * s.tw * 2 + s.ph);
    const a = Math.min(1, s.base * (0.12 + 0.88 * tw) * boost) * vis;
    if (a < 0.02) return;
    const [r, g, b] = s.color;
    const rad = s.r * (0.75 + 0.25 * tw);
    if (s.tier > 0) {
      const gr = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, rad * 3.2);
      gr.addColorStop(0, `rgba(${r},${g},${b},${a * 0.4})`);
      gr.addColorStop(1, `rgba(${r},${g},${b},0)`);
      ctx.fillStyle = gr;
      ctx.beginPath(); ctx.arc(s.x, s.y, rad * 3.2, 0, 6.2832); ctx.fill();
    }
    ctx.fillStyle = `rgba(${r},${g},${b},${a})`;
    ctx.beginPath(); ctx.arc(s.x, s.y, rad, 0, 6.2832); ctx.fill();
    if (s.sparkle && tw > 0.45) {
      const k = (tw - 0.45) / 0.55;
      const len = rad * (2.5 + 2.5 * k);
      ctx.strokeStyle = `rgba(${r},${g},${b},${a * 0.22 * k})`;
      ctx.lineWidth = 0.7;
      ctx.beginPath();
      ctx.moveTo(s.x - len, s.y); ctx.lineTo(s.x + len, s.y);
      ctx.moveTo(s.x, s.y - len); ctx.lineTo(s.x, s.y + len);
      ctx.stroke();
    }
  }

  const PULL_R = 300;                    // reach of the pointer's gravity (soft, no visible edge)
  function updateStars(dt, t) {
    const f60 = dt * 60;
    const damp = Math.pow(0.9, f60);
    const home = 0.9;                    // spring back to the home position (1/s^2 scale)
    for (const s of stars) {
      const hx = s.hx + Math.sin(t * 0.07 * s.drift + s.dph) * 6;
      const hy = s.hy + Math.cos(t * 0.06 * s.drift + s.dph) * 6;
      let pull = 0;
      if (hover.e > 0.01) {
        const rx = mouse.sx - s.x, ry = mouse.sy - s.y;
        const d = Math.hypot(rx, ry) || 0.001;
        if (d < PULL_R) {
          const k = 1 - d / PULL_R;
          pull = hover.e * k * k * (3 - 2 * k);           // smoothstep falloff
          const nx = rx / d, ny = ry / d;
          const towards = (d - s.orbit) * 0.7 * pull;      // gather toward a soft cloud around the pointer
          const spin = s.swirl * 18 * pull;                // gentle orbiting shimmer
          s.vx += (nx * towards - ny * spin) * dt;
          s.vy += (ny * towards + nx * spin) * dt;
        }
      }
      const hk = home * (1 - 0.85 * pull);
      s.vx += (hx - s.x) * hk * dt;
      s.vy += (hy - s.y) * hk * dt;
      s.vx *= damp; s.vy *= damp;
      s.x += s.vx * dt * 60 * 0.5;
      s.y += s.vy * dt * 60 * 0.5;
    }
  }

  /* ---------- shooting stars ---------- */
  let nextShot = 0.8;
  function spawnShooter() {
    const ang = rand(0.45, 0.8);
    const speed = rand(330, 520);
    shooters.push({
      x: rand(-0.05, 0.75) * W, y: rand(0, 0.45) * H,
      vx: Math.cos(ang) * speed, vy: Math.sin(ang) * speed,
      life: 0, max: rand(0.8, 1.4), len: rand(90, 150),
    });
  }
  function drawShooters(dt) {
    for (let i = shooters.length - 1; i >= 0; i--) {
      const s = shooters[i];
      s.life += dt; s.x += s.vx * dt; s.y += s.vy * dt;
      const p = s.life / s.max;
      if (p >= 1) { shooters.splice(i, 1); continue; }
      const fade = Math.sin(Math.PI * p);
      const sp = Math.hypot(s.vx, s.vy);
      const tx = s.x - (s.vx / sp) * s.len, ty = s.y - (s.vy / sp) * s.len;
      const g = ctx.createLinearGradient(tx, ty, s.x, s.y);
      g.addColorStop(0, 'rgba(255,230,240,0)');
      g.addColorStop(1, `rgba(255,236,244,${0.55 * fade})`);
      ctx.strokeStyle = g; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(tx, ty); ctx.lineTo(s.x, s.y); ctx.stroke();
      ctx.fillStyle = `rgba(255,245,250,${0.95 * fade})`;
      ctx.beginPath(); ctx.arc(s.x, s.y, 1.8, 0, 6.2832); ctx.fill();
    }
  }

  /* ---------- hover state ---------- */
  function updateHover(dt) {
    const f60 = dt * 60;
    if (mouse.init) {
      mouse.sx = ease(mouse.sx, mouse.x, 0.06, f60);     // smoothed pointer keeps everything fluid
      mouse.sy = ease(mouse.sy, mouse.y, 0.06, f60);
    }
    // swell in over ~1.2s, relax over ~2.5s
    hover.e = ease(hover.e, mouse.inside ? 1 : 0, mouse.inside ? 0.015 : 0.012, f60);
    const nx = mouse.init ? mouse.sx / W : 0.5, ny = mouse.init ? mouse.sy / H : 0.5;
    const t = mouse.inside ? 1 : 0;
    hover.left   = ease(hover.left,   t * Math.pow(1 - nx, 1.5), 0.04, f60);
    hover.right  = ease(hover.right,  t * Math.pow(nx, 1.5), 0.04, f60);
  }

  /* ---------- loop ---------- */
  let last = performance.now(), T = 0;
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05); last = now; T += dt;
    ctx.clearRect(0, 0, W, H);
    updateHover(dt);
    drawNebulae();
    drawEdgeGlows();
    updateStars(dt, T);
    for (const s of stars) drawStar(s, T);
    nextShot -= dt;
    if (nextShot <= 0) { spawnShooter(); nextShot = rand(2.2, 5.5); }
    drawShooters(dt);
    requestAnimationFrame(frame);
  }

  /* ---------- input ---------- */
  window.addEventListener('pointermove', e => {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.inside = true;
    if (!mouse.init) { mouse.sx = mouse.x; mouse.sy = mouse.y; mouse.init = true; }
  });
  document.documentElement.addEventListener('mouseleave', () => { mouse.inside = false; });
  window.addEventListener('blur', () => { mouse.inside = false; });
  window.addEventListener('resize', resize);

  resize();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
